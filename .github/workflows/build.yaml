name: Android Debug Build

on:
  push:
    branches:
      - master
    paths:
      - "action-trigger.md"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.parallel=true
        -Dorg.gradle.caching=true
        -Dorg.gradle.configuration-cache=true
        -Dorg.gradle.jvmargs=-Xmx4g

    steps:
      # Checkout repository
      - name: Checkout source
        uses: actions/checkout@v6

      # Install Java
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # Cache Gradle dependencies and wrapper
      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', '**/gradle.properties', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # Make Gradle executable
      - name: Grant execute permission
        run: chmod +x gradlew

      # Build Debug APK
      - name: Build Debug APK
        run: |
          ./gradlew \
            assembleDebug \
            --build-cache \
            --configuration-cache \
            --parallel \
            --stacktrace

      # Upload APK
      - name: Upload Debug APK
        uses: actions/upload-artifact@v6
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error